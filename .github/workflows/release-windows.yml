name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    name: Publish Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag and package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TARGET_REPOSITORY -ne 'ys06146/the-cabinet-desktop') {
            Write-Error "Releases are allowed only from ys06146/the-cabinet-desktop."
            exit 1
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Release tag must use the stable vMAJOR.MINOR.PATCH format."
            exit 1
          }

          $package = Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $packageVersion = [string]$package.version
          $expectedTag = "v$packageVersion"
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "package.json version must use the stable MAJOR.MINOR.PATCH format."
            exit 1
          }
          if ($env:RELEASE_TAG -ne $expectedTag) {
            Write-Error "Tag $env:RELEASE_TAG does not match package.json version $packageVersion."
            exit 1
          }

          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Prepare one draft Release
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          function Get-TagReleases {
            # Draft releases are included in the authenticated list but may return
            # 404 from the tag endpoint. Read every page before deciding to create.
            $response = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
            $pages = ConvertFrom-Json -InputObject ([string]::Join([Environment]::NewLine, $response)) -NoEnumerate
            if ($pages -isnot [array]) { throw 'GitHub release list has an unexpected format.' }
            foreach ($page in $pages) {
              if ($page -isnot [array]) { throw 'GitHub release page has an unexpected format.' }
              foreach ($candidate in $page) {
                if ($candidate.tag_name -eq $env:RELEASE_TAG) { $candidate }
              }
            }
          }

          $tagReleases = @(Get-TagReleases)
          if ($tagReleases.Count -gt 1) { throw 'Multiple releases exist for this tag. Refusing to choose or create another.' }
          if ($tagReleases.Count -eq 0) {
            $notesPath = "docs/releases/v$env:APP_VERSION.md"
            $createArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--draft',
              '--title', "The Cabinet v$env:APP_VERSION"
            )
            if (Test-Path -LiteralPath $notesPath -PathType Leaf) {
              $createArgs += @('--notes-file', $notesPath)
            } else {
              $createArgs += '--generate-notes'
            }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
            $tagReleases = @(Get-TagReleases)
          }

          if ($tagReleases.Count -ne 1) { throw 'Expected exactly one release after preparing the draft.' }
          $release = $tagReleases[0]
          if ($release.draft -ne $true -or $release.prerelease -ne $false) {
            throw 'Only a stable draft release can receive artifacts. Published releases must not be overwritten.'
          }
          if ([string]$release.id -notmatch '^[1-9][0-9]*$') { throw 'The draft release ID is invalid.' }
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append


      - name: Package Windows x64 update without publishing
        shell: pwsh
        run: npx --no-install electron-builder --win --x64 --publish never

      - name: Verify local release artifacts
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredFiles = @(
            "release/The-Cabinet-Setup-$env:APP_VERSION.exe",
            "release/The-Cabinet-Setup-$env:APP_VERSION.exe.blockmap",
            'release/latest.yml'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required release artifact was not generated: $file"
            }
          }
          if (-not (Test-Path -LiteralPath 'release/win-unpacked' -PathType Container)) {
            Write-Error 'The unpacked Windows build was not generated.'
            exit 1
          }
          if (-not (Get-ChildItem -LiteralPath 'release/win-unpacked' -Filter '*.exe' -File)) {
            Write-Error 'The unpacked Windows build does not contain an executable.'
            exit 1
          }

      - name: Upload artifacts to the verified draft ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RELEASE_ID -notmatch '^[1-9][0-9]*$') { throw 'The draft release ID is invalid.' }
          $requiredAssets = @(
            "The-Cabinet-Setup-$env:APP_VERSION.exe",
            "The-Cabinet-Setup-$env:APP_VERSION.exe.blockmap",
            'latest.yml'
          )

          foreach ($name in $requiredAssets) {
            $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the draft before uploading.' }
            $release = $releaseJson | ConvertFrom-Json
            if (
              [string]$release.id -ne $env:RELEASE_ID -or
              $release.draft -ne $true -or $release.prerelease -ne $false -or
              $release.tag_name -ne $env:RELEASE_TAG
            ) {
              throw 'Only the verified stable draft for this tag can receive artifacts.'
            }

            $localFile = Get-Item -LiteralPath (Join-Path 'release' $name)
            if ($localFile.Length -le 0) { throw "Release artifact is empty: $name" }
            $localDigest = 'sha256:' + (Get-FileHash -LiteralPath $localFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $existing = @($release.assets | Where-Object { $_.name -eq $name })
            if ($existing.Count -gt 0) {
              if (
                $existing.Count -ne 1 -or $existing[0].state -ne 'uploaded' -or
                $existing[0].size -ne $localFile.Length -or $existing[0].digest -ne $localDigest
              ) {
                throw "Existing release asset differs from the local file. Refusing to overwrite: $name"
              }
              Write-Output "Verified existing asset: $name"
              continue
            }

            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=" + [Uri]::EscapeDataString($name)
            $uploadedJson = gh api --method POST $uploadUrl --header 'Content-Type: application/octet-stream' --input $localFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not upload release asset: $name" }
            $uploaded = $uploadedJson | ConvertFrom-Json
            if (
              $uploaded.name -ne $name -or $uploaded.state -ne 'uploaded' -or
              $uploaded.size -ne $localFile.Length -or $uploaded.digest -ne $localDigest
            ) {
              throw "Uploaded release asset failed integrity verification: $name"
            }
          }


      - name: Verify draft assets and publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the draft release.' }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.draft -or $release.prerelease -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw 'The target release must still be the stable draft for this tag.'
          }

          $requiredAssets = @(
            "The-Cabinet-Setup-$env:APP_VERSION.exe",
            "The-Cabinet-Setup-$env:APP_VERSION.exe.blockmap",
            'latest.yml'
          )
          foreach ($name in $requiredAssets) {
            $assets = @($release.assets | Where-Object { $_.name -eq $name })
            if ($assets.Count -ne 1 -or $assets[0].state -ne 'uploaded') {
              throw "Draft release is missing a completed unique asset: $name"
            }
            $localFile = Get-Item -LiteralPath (Join-Path 'release' $name)
            if ($assets[0].size -ne $localFile.Length -or $localFile.Length -le 0) {
              throw "Draft release asset has the wrong size: $name"
            }
            $localDigest = 'sha256:' + (Get-FileHash -LiteralPath $localFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assets[0].digest -ne $localDigest) {
              throw "Draft release asset does not match the local SHA256: $name"
            }
          }

          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified draft release.' }

      - name: Verify published Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the published release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) {
            Write-Error 'The GitHub Release must be published and must not be a prerelease.'
            exit 1
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @(
            "The-Cabinet-Setup-$env:APP_VERSION.exe",
            "The-Cabinet-Setup-$env:APP_VERSION.exe.blockmap",
            'latest.yml'
          )
          foreach ($asset in $requiredAssets) {
            if ($assetNames -notcontains $asset) {
              throw "Published GitHub Release is missing required asset: $asset"
            }
          }
